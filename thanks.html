<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message sent — Neural Lightning</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark:         #0f0f1a;
      --dark-mid:     #1A1A2E;
      --accent:       #1F5C8B;
      --accent-light: #2a7ab8;
      --text:         #e8e8f0;
      --text-muted:   #9090a8;
      --border:       #2a2a40;
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      max-width: 480px;
      text-align: center;
    }

    .eyebrow {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-light);
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    p {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1.75rem;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--accent-light); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Neural Lightning</p>
    <h1>Message sent</h1>
    <p>Thanks for reaching out. Your message has been received.</p>
    <a href="/" class="btn">Back to home</a>
  </main>
</body>
</html>
